name: update-data
on:
  schedule:
    - cron: "17 6 * * *"   # 毎日 15:17（日本時間）
  workflow_dispatch:
  push:
    paths: ["scripts/update-data.mjs", ".github/workflows/update-data.yml"]
permissions:
  contents: write
concurrency:
  group: update-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save jsdom@24 xlsx@0.18.5
      - run: node scripts/update-data.mjs
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "変更なし"; exit 0; fi
          git commit -m "データ更新：e-Stat 月次Excelを取り込み"
          git pull --rebase origin main
          git push
