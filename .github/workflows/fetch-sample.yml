name: fetch-sample
on:
  push:
    paths: [".github/workflows/fetch-sample.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download e-Stat monthly Excel (2026-04 表15/表16)
        run: |
          mkdir -p sample
          curl -sSL -A "Mozilla/5.0" -o sample/t15_2026_04.bin "https://www.e-stat.go.jp/stat-search/file-download?statInfId=000040459301&fileKind=0"
          curl -sSL -A "Mozilla/5.0" -o sample/t16_2026_04.bin "https://www.e-stat.go.jp/stat-search/file-download?statInfId=000040459302&fileKind=0"
          ls -la sample; file sample/* || true
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sample
          git commit -m "sample: e-Stat Excel for parser check" || echo nothing
          git push
