name: fetch-sample
on:
  push:
    paths: [".github/workflows/fetch-sample.yml"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p sample
          for p in "b5:000040511824" "b61:000040511825" "b71:000040511827"; do n=${p%%:*}; id=${p##*:}; curl -sSL -A "Mozilla/5.0" -o sample/${n}_2026_08.bin "https://www.e-stat.go.jp/stat-search/file-download?statInfId=${id}&fileKind=0"; done
          ls -la sample
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sample && git commit -m "sample: e-Stat 建築物 表5/6-1/7-1" && git push
